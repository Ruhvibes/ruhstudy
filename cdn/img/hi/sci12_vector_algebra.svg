<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 880" font-family="'Noto Sans Devanagari','DejaVu Sans',sans-serif">
<rect x="0" y="0" width="900" height="880" fill="#ffffff"/>
<defs>
<marker id="mK" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#333333"/></marker>
<marker id="mB" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#2471a3"/></marker>
<marker id="mR" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c0392b"/></marker>
<marker id="mG" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1e8449"/></marker>
<marker id="mY" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#b7950b"/></marker>
<marker id="mO" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#d35400"/></marker>
<marker id="mP" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7d3c98"/></marker>
</defs>
<text x="450" y="54" text-anchor="middle" font-size="32" font-weight="bold" fill="#1F4E79">सदिश बीजगणित — मुख्य सूत्र</text>
<rect x="50" y="110" width="385" height="200" rx="14" fill="#d6eaf8" stroke="#2471a3" stroke-width="3"/><text x="242" y="146" text-anchor="middle" font-size="22" font-weight="bold" fill="#2471a3">सदिश का मापांक</text><text x="242" y="174" text-anchor="middle" font-size="20" fill="#111111">|a| = √(x² + y² + z²)</text><text x="242" y="206" text-anchor="middle" font-size="20" fill="#111111">मूलबिंदु से दूरी</text><rect x="465" y="110" width="385" height="200" rx="14" fill="#d5f5e3" stroke="#1e8449" stroke-width="3"/><text x="657" y="146" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e8449">अदिश गुणन</text><text x="657" y="174" text-anchor="middle" font-size="20" fill="#111111">a·b = |a||b|cosθ</text><text x="657" y="206" text-anchor="middle" font-size="20" fill="#111111">a·b = x₁x₂ + y₁y₂ + z₁z₂</text><rect x="50" y="335" width="385" height="200" rx="14" fill="#fadbd8" stroke="#c0392b" stroke-width="3"/><text x="242" y="371" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">सदिश गुणन</text><text x="242" y="399" text-anchor="middle" font-size="20" fill="#111111">a×b = |a||b|sinθ n̂</text><text x="242" y="431" text-anchor="middle" font-size="20" fill="#111111">परिणाम n̂ दिशा में सदिश</text><rect x="465" y="335" width="385" height="200" rx="14" fill="#e8daef" stroke="#7d3c98" stroke-width="3"/><text x="657" y="371" text-anchor="middle" font-size="22" font-weight="bold" fill="#7d3c98">लंबवत् शर्त</text><text x="657" y="399" text-anchor="middle" font-size="20" fill="#111111">a·b = 0 ⇒ a ⊥ b</text><text x="657" y="431" text-anchor="middle" font-size="20" fill="#111111">(शून्येतर सदिशों हेतु)</text><rect x="50" y="560" width="385" height="200" rx="14" fill="#fdebd0" stroke="#d35400" stroke-width="3"/><text x="242" y="596" text-anchor="middle" font-size="22" font-weight="bold" fill="#d35400">समांतर शर्त</text><text x="242" y="624" text-anchor="middle" font-size="20" fill="#111111">a×b = 0 ⇒ a ∥ b</text><text x="242" y="656" text-anchor="middle" font-size="20" fill="#111111">एक-दूसरे के अदिश गुणज</text><rect x="465" y="560" width="385" height="200" rx="14" fill="#fef9e7" stroke="#b7950b" stroke-width="3"/><text x="657" y="596" text-anchor="middle" font-size="22" font-weight="bold" fill="#b7950b">प्रक्षेप</text><text x="657" y="624" text-anchor="middle" font-size="20" fill="#111111">a का b पर प्रक्षेप = (a·b)/|b|</text><text x="657" y="656" text-anchor="middle" font-size="20" fill="#111111">घटक = ((a·b)/|b|²) b</text>
</svg>